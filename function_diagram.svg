<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>How the six files in the Hangman program connect</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="760" height="580" fill="#ffffff"/>

  <!-- hangman.h -->
  <rect x="40" y="20" width="680" height="64" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="380" y="46" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">hangman.h</text>
  <text x="380" y="68" text-anchor="middle" font-size="12" fill="#374151">Libraries, limits, GameRecord struct, every prototype. #included by all five .c files.</text>

  <!-- main -->
  <rect x="280" y="110" width="200" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">Hangman_main.c</text>
  <text x="380" y="157" text-anchor="middle" font-size="12" fill="#374151">Menu and game flow</text>
  <text x="380" y="174" text-anchor="middle" font-size="12" fill="#374151">main(), playGame()</text>

  <!-- game.c -->
  <rect x="40" y="270" width="200" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="296" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">game.c</text>
  <text x="140" y="317" text-anchor="middle" font-size="12" fill="#374151">playRound, showBoard,</text>
  <text x="140" y="334" text-anchor="middle" font-size="12" fill="#374151">computeScore, drawHangman</text>

  <!-- words.c -->
  <rect x="280" y="270" width="200" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="296" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">words.c</text>
  <text x="380" y="317" text-anchor="middle" font-size="12" fill="#374151">loadWords, saveWords,</text>
  <text x="380" y="334" text-anchor="middle" font-size="12" fill="#374151">addWord, showWords</text>

  <!-- scores.c -->
  <rect x="520" y="270" width="200" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="296" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">scores.c</text>
  <text x="620" y="317" text-anchor="middle" font-size="12" fill="#374151">loadScores, saveScores,</text>
  <text x="620" y="334" text-anchor="middle" font-size="12" fill="#374151">showScores, showStatistics</text>

  <!-- input.c -->
  <rect x="100" y="430" width="240" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="220" y="456" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">input.c</text>
  <text x="220" y="477" text-anchor="middle" font-size="12" fill="#374151">readNumber, readLetter,</text>
  <text x="220" y="494" text-anchor="middle" font-size="12" fill="#374151">askYesNo, readWord</text>

  <!-- words.txt -->
  <rect x="385" y="430" width="130" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="450" y="466" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">words.txt</text>

  <!-- scores.txt -->
  <rect x="555" y="430" width="130" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="620" y="466" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">scores.txt</text>

  <!-- main calls game / words / scores -->
  <line x1="350" y1="190" x2="145" y2="268" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="190" x2="380" y2="268" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="190" x2="615" y2="268" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- main calls input (elbow along the left edge) -->
  <path d="M280,150 H20 V470 H98" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- game and words call input -->
  <line x1="165" y1="350" x2="190" y2="428" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="350" x2="280" y2="428" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- data file arrows (both directions) -->
  <line x1="450" y1="350" x2="450" y2="428" stroke="#6b7280" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="620" y1="350" x2="620" y2="428" stroke="#6b7280" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="458" y="393" font-size="11" fill="#4b5563">load / save</text>
  <text x="628" y="393" font-size="11" fill="#4b5563">load / save</text>

  <!-- legend -->
  <line x1="40" y1="548" x2="80" y2="548" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="90" y="552" font-size="12" fill="#374151">calls functions in</text>
  <rect x="250" y="538" width="30" height="20" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="290" y="552" font-size="12" fill="#374151">data file on disk</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
